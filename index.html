<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Weather App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container pb-3">
    <form>
      <h3 class="alert text-light text-center">🌤️ Weather App</h3>
      <select id="countrylist" class="form-select mb-2"></select>
      <select id="statelist" class="form-select mb-2" disabled><option>Select State</option></select>
      <select id="citylist" class="form-select mb-2" disabled><option>Select City</option></select>
    </form>

    <div id="weatherwidget" class="d-flex justify-content-center align-items-center">
      <div class="card">
        <div class="card-body">
          <h5 class="card-title">Select a city to view weather</h5>
        </div>
      </div>
    </div>

    <div class="mt-3 d-flex justify-content-between">
      <button class="btn btn-primary" id="commentBtn">💬 Comment</button>
      <button class="btn btn-secondary" id="historyBtn">📜 History</button>
    </div>

    <div id="commentSection" class="mt-3" style="display: none;">
      <input type="text" id="commentInput" class="form-control mb-2" placeholder="Write a comment...">
      <button class="btn btn-success" id="submitComment">Submit</button>
      <ul class="list-group mt-2" id="commentList"></ul>
    </div>

    <div id="historySection" class="mt-3" style="display: none;">
      <h6 style="color: #f1f1f2;">Weather History</h6>
      <ul class="list-group" id="historyList"></ul>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
